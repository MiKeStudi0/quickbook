{% extends 'dashboard/base.html' %}

{% block title %}{{ title }} - QuickBook Staff{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto py-6">
    <div class="bg-white border border-zinc-200/80 rounded-2xl p-8 shadow-sm">
        <div class="mb-6 pb-4 border-b border-zinc-100">
            <h2 class="text-xl font-bold tracking-tight text-zinc-900">{{ title }}</h2>
            <p class="text-xs text-zinc-500 mt-1">Configure event metadata, venue details, and seat capacities</p>
        </div>

        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Event Name</label>
                <input type="text" name="name" value="{{ form.name.value|default:'' }}" required class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-300 text-sm font-medium text-zinc-900 focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:border-zinc-900 transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Description</label>
                <textarea name="description" rows="3" class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-300 text-sm font-medium text-zinc-900 focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:border-zinc-900 transition-all">{{ form.description.value|default:'' }}</textarea>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Venue Location</label>
                    <input type="text" name="venue" value="{{ form.venue.value|default:'' }}" required class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-300 text-sm font-medium text-zinc-900 focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:border-zinc-900 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Event Date & Time</label>
                    <input type="datetime-local" name="event_date" value="{{ form.event_date.value|date:'Y-m-d\TH:i' }}" required class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-300 text-sm font-medium text-zinc-900 focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:border-zinc-900 transition-all">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Total Seats</label>
                    <input type="number" name="total_seats" value="{{ form.total_seats.value|default:'' }}" required class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-300 text-sm font-medium text-zinc-900 focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:border-zinc-900 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Available Seats</label>
                    <input type="number" name="available_seats" value="{{ form.available_seats.value|default:'' }}" class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-300 text-sm font-medium text-zinc-900 focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:border-zinc-900 transition-all" placeholder="Defaults to Total">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Assigned Vendor</label>
                    {{ form.vendor }}
                </div>
            </div>

            <div class="flex items-center justify-end space-x-3 pt-6 border-t border-zinc-100">
                <a href="{% url 'dashboard-event-list' %}" class="px-4 py-2.5 rounded-xl border border-zinc-200 text-xs font-medium text-zinc-600 hover:bg-zinc-100 transition-colors">Cancel</a>
                <button type="submit" class="px-5 py-2.5 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-white font-medium text-xs transition-all shadow-sm">Save Event</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
