{% extends 'dashboard/base.html' %}

{% block title %}{{ title }} - QuickBook Staff{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto py-6">
    <div class="bg-white border border-zinc-200/80 rounded-2xl p-8 shadow-sm">
        <div class="mb-6 pb-4 border-b border-zinc-100">
            <h2 class="text-xl font-bold tracking-tight text-zinc-900">{{ title }}</h2>
            <p class="text-xs text-zinc-500 mt-1">Configure vendor profile credentials and settings</p>
        </div>

        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Username</label>
                <input type="text" name="username" value="{{ form.username.value|default:'' }}" required class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-300 text-sm font-medium text-zinc-900 focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:border-zinc-900 transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Email Address</label>
                <input type="email" name="email" value="{{ form.email.value|default:'' }}" required class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-300 text-sm font-medium text-zinc-900 focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:border-zinc-900 transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Password</label>
                <input type="password" name="password" class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-300 text-sm font-medium text-zinc-900 focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:border-zinc-900 transition-all" placeholder="Enter password">
                <p class="text-xs text-zinc-400 mt-1">Leave blank if updating an existing vendor without resetting password.</p>
            </div>

            <div class="flex items-center space-x-2 pt-2">
                <input type="checkbox" name="is_vendor" id="id_is_vendor" checked class="w-4 h-4 rounded text-zinc-900 focus:ring-zinc-900 border-zinc-300">
                <label for="id_is_vendor" class="text-sm font-medium text-zinc-800">Activate Vendor Account Status</label>
            </div>

            <div class="flex items-center justify-end space-x-3 pt-6 border-t border-zinc-100">
                <a href="{% url 'dashboard-vendor-list' %}" class="px-4 py-2.5 rounded-xl border border-zinc-200 text-xs font-medium text-zinc-600 hover:bg-zinc-100 transition-colors">Cancel</a>
                <button type="submit" class="px-5 py-2.5 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-white font-medium text-xs transition-all shadow-sm">Save Vendor</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
